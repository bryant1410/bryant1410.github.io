<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#bd5d38">

  <script>
    if (/^\/(resume|cv)\.pdf$/i.test(location.pathname)) {
      location.replace("/resume/main.pdf");
    }

    try {
      const theme = localStorage.getItem("theme");
      if (theme === "light" || theme === "dark") {
        document.documentElement.dataset.theme = theme;
      }
    } catch {
    }
  </script>

  <title>Page not found · Santiago Castro</title>

  <!-- Absolute paths: GitHub Pages serves this page at any missing URL, at any depth. -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">

  <link rel="preload" href="/fonts/saira-extra-condensed-latin-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/mulish-latin-400.woff2" as="font" type="font/woff2" crossorigin>

  <style>
    @font-face {
      font-family: 'Mulish';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('/fonts/mulish-latin-400.woff2') format('woff2');
    }

    @font-face {
      font-family: 'Saira Extra Condensed';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url('/fonts/saira-extra-condensed-latin-700.woff2') format('woff2');
    }

    :root {
      --primary-color: #bd5d38;
      --secondary-color: #824027;
      --link-color: #b85934;
      --bg-color: #fff;
      --text-color: #6c757d;
      --heading-color: #343a40;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1.25rem 8vh;
      font-family: 'Mulish', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 1.15rem;
      line-height: 1.5;
      background-color: var(--bg-color);
      color: var(--text-color);
      text-align: center;
    }

    h1 {
      margin: 0 0 1rem;
      font-family: 'Saira Extra Condensed', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 700;
      font-size: clamp(4rem, 30vw, 9rem);
      line-height: 0.9;
      color: var(--heading-color);
    }

    h1 span {
      color: var(--primary-color);
    }

    a {
      color: var(--link-color);
    }

    a:hover, a:focus, a:active {
      color: var(--secondary-color);
    }

    .theme-toggle {
      position: fixed;
      top: 0.75rem;
      right: 0.75rem;
      z-index: 1032;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      padding: 0;
      border: none;
      border-radius: 50%;
      background-color: transparent;
      color: var(--text-color);
      opacity: 0.55;
      cursor: pointer;
      transition: opacity 0.15s ease, color 0.15s ease, background-color 0.15s ease;
    }

    @media (min-width: 600px) {
      .theme-toggle {
        top: 1rem;
        right: 1rem;
      }
    }

    .theme-toggle:hover,
    .theme-toggle:focus-visible {
      opacity: 1;
      color: var(--heading-color);
      background-color: rgba(108, 117, 125, 0.12);
    }

    .theme-toggle:focus-visible {
      outline: 2px solid var(--secondary-color);
      outline-offset: 2px;
    }

    .theme-toggle svg {
      display: none;
      width: 1rem;
      height: 1rem;
      fill: currentColor;
    }

    :root:not([data-theme]) .theme-toggle svg[data-icon="system"],
    :root[data-theme="light"] .theme-toggle svg[data-icon="light"],
    :root[data-theme="dark"] .theme-toggle svg[data-icon="dark"] {
      display: block;
    }

    @media screen and (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --primary-color: #d46b43;
        --secondary-color: #f09573;
        --link-color: #e07a52;
        --bg-color: #181a1b;
        --text-color: #b0b8c0;
        --heading-color: #f1f3f5;
      }
    }

    @media screen {
      :root[data-theme="dark"] {
        --primary-color: #d46b43;
        --secondary-color: #f09573;
        --link-color: #e07a52;
        --bg-color: #181a1b;
        --text-color: #b0b8c0;
        --heading-color: #f1f3f5;
      }
    }
  </style>
</head>

<body>

<button type="button" class="theme-toggle" aria-label="Theme: System (switch to Light)" title="Theme: System (click for Light)">
  <svg data-icon="system" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5zm2 0v9h12V5H6zm2 13h8a1 1 0 1 1 0 2H8a1 1 0 1 1 0-2z"/></svg>
  <svg data-icon="light" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1zm0 16a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0v-2a1 1 0 0 1 1-1zm9-7a1 1 0 1 1 0 2h-2a1 1 0 1 1 0-2h2zM5 11a1 1 0 1 1 0 2H3a1 1 0 1 1 0-2h2zm13.36-6.36a1 1 0 0 1 0 1.41l-1.41 1.42a1 1 0 1 1-1.42-1.42l1.42-1.41a1 1 0 0 1 1.41 0zM7.05 16.95a1 1 0 0 1 0 1.41l-1.41 1.42a1 1 0 1 1-1.42-1.42l1.42-1.41a1 1 0 0 1 1.41 0zm11.31 1.41a1 1 0 0 1-1.41 0l-1.42-1.41a1 1 0 1 1 1.42-1.42l1.41 1.42a1 1 0 0 1 0 1.41zM7.05 7.05a1 1 0 0 1-1.41 0L4.22 5.64a1 1 0 1 1 1.42-1.42l1.41 1.42a1 1 0 0 1 0 1.41z"/></svg>
  <svg data-icon="dark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>
<script>
  (() => {
    const root = document.documentElement;
    const btn = document.querySelector(".theme-toggle");
    const labels = {
      system: ["Theme: System (switch to Light)", "Theme: System (click for Light)"],
      light: ["Theme: Light (switch to Dark)", "Theme: Light (click for Dark)"],
      dark: ["Theme: Dark (switch to System)", "Theme: Dark (click for System)"],
    };
    const syncLabel = () => {
      const current = root.dataset.theme || "system";
      const [ariaLabel, title] = labels[current] || labels.system;
      btn.setAttribute("aria-label", ariaLabel);
      btn.setAttribute("title", title);
    };
    syncLabel();
    btn.addEventListener("click", () => {
      const current = root.dataset.theme || "system";
      const next = current === "system" ? "light" : current === "light" ? "dark" : "system";
      if (next === "system") {
        delete root.dataset.theme;
        try {
          localStorage.removeItem("theme");
        } catch {
        }
      } else {
        root.dataset.theme = next;
        try {
          localStorage.setItem("theme", next);
        } catch {
        }
      }
      syncLabel();
    });
  })();
</script>

<main>
  <h1>4<span>0</span>4</h1>
  <p>This page doesn't exist.</p>
  <p><a href="/">← Go to the home page</a></p>
</main>

</body>

</html>
