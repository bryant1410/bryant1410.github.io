<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#bd5d38">

  <script>
    if (/^\/(resume|cv)\.pdf$/i.test(location.pathname)) {
      location.replace("/resume/main.pdf");
    }
  </script>

  <title>Page not found · Santiago Castro</title>

  <!-- Absolute paths: GitHub Pages serves this page at any missing URL, at any depth. -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">

  <link rel="preload" href="/fonts/saira-extra-condensed-latin-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/mulish-latin-400.woff2" as="font" type="font/woff2" crossorigin>

  <style>
    @font-face {
      font-family: 'Mulish';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('/fonts/mulish-latin-400.woff2') format('woff2');
    }

    @font-face {
      font-family: 'Saira Extra Condensed';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url('/fonts/saira-extra-condensed-latin-700.woff2') format('woff2');
    }

    :root {
      --primary-color: #bd5d38;
      --secondary-color: #824027;
      --link-color: #b85934;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      border-top: 27px solid var(--primary-color);
      font-family: 'Mulish', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 1.15rem;
      line-height: 1.5;
      color: #6c757d;
      text-align: center;
    }

    h1 {
      margin: 0 0 1rem;
      font-family: 'Saira Extra Condensed', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 700;
      font-size: clamp(4rem, 30vw, 9rem);
      line-height: 0.9;
      color: #343a40;
    }

    h1 span {
      color: var(--primary-color);
    }

    a {
      color: var(--link-color);
    }

    a:hover, a:focus, a:active {
      color: var(--secondary-color);
    }

    @media screen and (prefers-color-scheme: dark) {
      :root {
        --primary-color: #d46b43;
        --secondary-color: #f09573;
        --link-color: #e07a52;
      }

      body {
        background-color: #181a1b;
        color: #b0b8c0;
      }

      h1 {
        color: #f1f3f5;
      }
    }
  </style>
</head>

<main>

</main>

</body>

</html>
