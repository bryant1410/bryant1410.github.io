name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      - name: HTML Validate
        run: npx --yes html-validate index.html 404.html cv.html

      - name: JavaScript Quote Consistency
        run: |
          python3 - <<'EOF'
          import re, sys

          errors = 0
          for path in ["index.html", "404.html", "cv.html"]:
              with open(path, encoding="utf-8") as f:
                  content = f.read()
              scripts = re.findall(r"<script>(.*?)</script>", content, re.DOTALL)
              for script in scripts:
                  code = re.sub(r"/\*.*?\*/", "", script, flags=re.DOTALL)
                  for line in code.splitlines():
                      line_code = re.sub(r"//.*$", "", line).strip()
                      line_code = re.sub(r'"(?:\\.|[^"\\])*"', '""', line_code)
                      line_code = re.sub(r'/(?:\\.|[^/\\\n])+/[a-z]*', '', line_code)
                      if "'" in line_code:
                          print(f"{path}: expected double quotes, found single quote in: {line.strip()}")
                          errors += 1

          if errors:
              sys.exit(1)
          EOF

      - name: Markdownlint
        run: npx --yes markdownlint-cli README.md

      - name: Actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: Pa11y (Accessibility)
        run: |
          npx --yes pa11y --config .pa11y.json "file://${GITHUB_WORKSPACE}/index.html"
          npx --yes pa11y --config .pa11y.json "file://${GITHUB_WORKSPACE}/404.html"
