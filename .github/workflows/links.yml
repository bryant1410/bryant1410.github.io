name: Check links

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 12 * * 1"  # Weekly, Mondays at 12:00 UTC.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch and extract links from the CV (served from another repo)
        run: |
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 --retry-all-errors \
            https://santi.uy/resume/main.pdf --output /tmp/resume.pdf
          python3 - <<'PY'
          import re, sys, zlib

          with open("/tmp/resume.pdf", "rb") as f:
              data = f.read()
          chunks = [data]
          for match in re.finditer(rb"stream\s+(.*?)\s+endstream", data, re.S):
              try:
                  chunks.append(zlib.decompress(match.group(1)))
              except zlib.error:
                  pass

          links = sorted({
              re.sub(rb"\\([()\\])", rb"\1", u).decode("utf-8", "replace")
              for chunk in chunks
              for u in re.findall(rb"/URI\s*\(((?:\\.|[^\\()])*)\)", chunk)
          })
          if not links:
              sys.exit("No /URI links found in resume/main.pdf")

          with open("resume-links.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(links) + "\n")
          print(f"Extracted {len(links)} unique links from resume/main.pdf")
          PY

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # Relative links are checked against the checked-out files (`--root-dir` resolves root-relative ones like
          # "/favicon.ico" in 404.html). The CV is served from a separate repo, so the previous step downloads it and
          # dumps its links into `resume-links.txt`. web.eecs.umich.edu doesn't send its intermediate TLS certificate
          # (browsers cope, strict clients like lychee/curl don't), so it's skipped. LinkedIn blocks bots (HTTP 999),
          # and umich.edu/Stack Overflow/X often block or rate-limit CI, hence the extra accepted status codes.
          args: >-
            --root-dir ${{ github.workspace }}
            --exclude-loopback
            --exclude '/?resume/main\.pdf$'
            --exclude '^https://web\.eecs\.umich\.edu/'
            --accept 200..=299,403,429,999
            --no-progress
            index.html cv.html 404.html README.md sitemap.xml resume-links.txt
          fail: true
